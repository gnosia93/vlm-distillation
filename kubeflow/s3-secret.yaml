# S3 자격증명. 실제 값으로 채운 뒤 `kubectl apply -f s3-secret.yaml`.
# (권장: kubectl create secret generic ... 로 직접 만들거나 IRSA/서비스어카운트 사용)
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: kubeflow-user
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_DEFAULT_REGION: "ap-northeast-2"
  # S3 호환 스토어(MinIO 등)를 쓸 때만 지정. 실제 AWS S3면 이 줄 삭제.
  # AWS_ENDPOINT_URL: "http://minio.kubeflow.svc:9000"
