# MNIST DDP 훈련 — Kubeflow Trainer (V2) 버전.
#
# 실행:  kubectl apply -f trainjob-mnist.yaml
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: mnist-ddp
  namespace: mnist
spec:
  # 클러스터에 미리 설치된 분산 런타임 참조 (torch distributed).
  # 이름은 배포판마다 다를 수 있음 -> `kubectl get clustertrainingruntime` 확인.
  runtimeRef:
    name: torch-distributed
    apiGroup: trainer.kubeflow.org
    kind: ClusterTrainingRuntime
  trainer:
    numNodes: 2                        # 역할 없이 노드 수만 지정 (V1 의 Master+Worker 대체)
    numProcPerNode: 1                  # 노드당 프로세스(=GPU) 수. 단일노드 2 GPU 면 numNodes:1 + 이 값 "2"
    image: ${IMAGE_URI}                # ecr image URI
    command:
      - "torchrun"                     # torchrun 으로 실행해야 분산 훈련이 시작됨 - RANK, WORLD_SIZE, rendezvous 등이 runtime 에 의해 자동으로 주입됨. 
      - "train.py"
      - "--epochs=50"
      - "--batch-size=64"
    env:
      - name: S3_BUCKET
        value: "${BUCKET}"
      - name: S3_PREFIX
        value: "mnist/raw"
      - name: NCCL_DEBUG               # ★ NCCL 로그 활성화
        value: "INFO"  
    resourcesPerNode:
      requests:
        cpu: "16"
        memory: 128Gi
        nvidia.com/gpu: 1              # 노드당 GPU 1개 (numProcPerNode 와 맞춤), limits 에만 명시해도 request 시 반영됨
        vpc.amazonaws.com/efa: 1       # ★ EFA 인터페이스 수 (인스턴스마다 다름!)
      limits:
        cpu: "32"
        memory: 256Gi
        nvidia.com/gpu: 1              # 노드당 GPU 1개 (numProcPerNode 와 맞춤), limits 에만 명시해도 request 시 반영됨
        vpc.amazonaws.com/efa: 1       # ★ EFA 인터페이스 수 (인스턴스마다 다름!)

  # ★ 여기부터 추가 — 서비스 어카운트 지정
  runtimePatches:
    - manager: "example.com/mnist-irsa"                # 소유자 식별용 임의 문자열 (비어있으면 안 됨, 도메인 형식)
      trainingRuntimeSpec:
        template:
          spec:
            replicatedJobs:
              - name: node                             # torch-distributed 런타임의 replicatedJob 이름
                template:
                  spec:
                    template:
                      spec:
                        serviceAccountName: mnist-sa
                        # ★ Pod 의 spec 밑에 위치합니다. (containers, serviceAccountName 과 동일 레벨)
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: node.kubernetes.io/instance-type
                                      operator: In
                                      values:
         #                               - g7e.2xlarge          # 1 GPU / 96 VRAM / 8 vCPUs,      64 GiB RAM,   1.9 x 1 TB Instance Storage 
         #                               - g7e.4xlarge          # 1 GPU / 96 VRAM / 16 vCPUs,    128 GiB RAM    1.9 x 1 TB Instance Storage 
                                        - g7e.8xlarge          # 1 GPU / 96 VRAM / 32 vCPUs,    256 GiB RAM    1.9 x 1 TB Instance Storage 
                                        - g7e.12xlarge         # 2 GPU / 192 VRAM / 48 vCPUs,   512 GiB RAM    3.8 x 1 TB Instance Storage 
                                        - g7e.24xlarge         # 4 GPU / 384 VRAM / 96 vCPUs,  1024 GiB RAM    3.8 x 2 TB Instance Storage 
                                        - g7e.48xlarge         # 8 GPU / 768 VRAM / 192 vCPUs, 2048 GiB RAM    3.8 x 4 TB Instance Storage 
                        volumes:
                          - name: dshm
                            emptyDir:
                              medium: Memory
                              sizeLimit: 16Gi          # ★ 기본값은 64MB, DataLoader의 num_workers를 높이면 /dev/shm(공유 메모리) 용량이 부족해 Bus error 발생
                                                       # ★ 8Gi ~ 32Gi 정도면 충분
                          - name: local-nvme
                            hostPath:
                              path: /mnt/nvme          # ★ 노드의 로컬 SSD -> mount 포인트 확인 필요. 
                        containers:                    # ★ 추가
                          - name: node
                            volumeMounts:
                              - name: dshm
                                mountPath: /dev/shm
                              - name: local-nvme
                                mountPath: /data       # 컨테이너 내부   
                            securityContext:
                              capabilities:
                                add: ["IPC_LOCK"]      # ★ EFA 메모리 고정
